<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最强蜗牛攻略助手</title>
<style>
  :root {
    --bg1:#12101e; --bg2:#1c1830;
    --panel:#211c33; --panel2:#2b2544;
    --text:#f3efe3; --muted:#a89fb8;
    --gold:#eec767; --gold2:#c9962f; --gold-dim:#8a743b;
    --fire:#ff6a3d; --ok:#3ddc97;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    color:var(--text);
    height:100vh; display:flex; flex-direction:column;
    background:
      radial-gradient(1200px 500px at 20% -10%, rgba(217,164,65,.16), transparent 60%),
      radial-gradient(900px 400px at 90% 110%, rgba(255,106,61,.10), transparent 60%),
      linear-gradient(160deg, var(--bg1), var(--bg2) 70%, #221a34);
  }
  /* 星星光点装饰 */
  #chatbox::before, .bar::before { content:''; position:fixed; inset:0; pointer-events:none;
    background-image:radial-gradient(1px 1px at 25% 18%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 70% 40%, rgba(255,255,255,.35), transparent),
      radial-gradient(1.5px 1.5px at 45% 72%, rgba(238,199,103,.5), transparent),
      radial-gradient(1px 1px at 85% 85%, rgba(255,255,255,.3), transparent);
    background-repeat:repeat; background-size:380px 320px; opacity:.5; }

  header {
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:14px 20px;
    background:linear-gradient(180deg, rgba(238,199,103,.12), transparent), #1c1830;
    border-bottom:2px solid transparent;
    border-image:linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent) 1;
    box-shadow:0 4px 24px rgba(0,0,0,.45);
  }
  header h1 {
    font-size:20px; letter-spacing:2px;
    background:linear-gradient(180deg, #ffe9a8, var(--gold) 55%, var(--gold2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 0 10px rgba(238,199,103,.35));
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #kb-status { font-size:12px; color:var(--muted); white-space:nowrap; }

  #chatbox {
    flex:1; overflow-y:auto; padding:20px 14px;
    max-width:860px; width:100%; margin:0 auto;
    display:flex; flex-direction:column; gap:14px;
    scrollbar-width:thin; scrollbar-color:var(--gold-dim) transparent;
  }
  #chatbox::-webkit-scrollbar { width:6px; }
  #chatbox::-webkit-scrollbar-thumb { background:var(--gold-dim); border-radius:3px; }

  .bar {
    padding:12px 14px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, rgba(238,199,103,.04)), #1a1630;
    border-top:2px solid transparent;
    border-image:linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent) 1;
  }
  .toolrow { display:flex; align-items:center; gap:10px; max-width:860px; margin:0 auto 8px; flex-wrap:wrap; }
  .pick {
    font-size:13px; color:var(--gold); cursor:pointer; padding:7px 12px;
    border:1px solid var(--gold-dim); border-radius:8px; background:rgba(238,199,103,.06);
    transition:.2s; user-select:none;
  }
  .pick:hover { border-color:var(--gold); background:rgba(238,199,103,.14); }
  #urlInput {
    flex:1; min-width:150px; padding:8px 12px; border-radius:8px;
    border:1px solid #3a3058; background:#241f3a; color:var(--text); font-size:13px;
  }
  #urlInput:focus { outline:none; border-color:var(--gold2); }
  #urlInput::placeholder { color:#6d648a; }
  #fileChips { display:flex; flex-wrap:wrap; gap:6px; max-width:860px; margin:0 auto 6px; }
  .chip {
    font-size:12px; background:rgba(255,106,61,.10); border:1px solid rgba(255,106,61,.4);
    padding:3px 8px; border-radius:10px; color:var(--muted);
  }
  .chip b { color:var(--text); font-weight:normal; }
  .chip .x { cursor:pointer; margin-left:6px; color:var(--fire); }

  .inrow { display:flex; gap:10px; max-width:860px; margin:0 auto; }
  #input {
    flex:1; padding:13px 16px; border-radius:10px; font-size:15px;
    border:1px solid #3a3058; background:#241f3a; color:var(--text);
  }
  #input:focus { outline:none; border-color:var(--gold2); box-shadow:0 0 0 3px rgba(238,199,103,.12); }
  #input::placeholder { color:#6d648a; }
  .send {
    padding:13px 26px; border-radius:10px; border:1px solid var(--gold2); cursor:pointer;
    font-size:15px; font-weight:700; letter-spacing:2px; color:#2a1c04;
    background:linear-gradient(180deg, #ffe9a8, var(--gold) 55%, var(--gold2));
    box-shadow:0 3px 14px rgba(238,199,103,.35), inset 0 1px 0 #fff3;
    transition:.15s;
  }
  .send:hover { filter:brightness(1.08); box-shadow:0 4px 20px rgba(238,199,103,.55), inset 0 1px 0 #fff3; }
  .send:disabled { opacity:.5; cursor:not-allowed; filter:none; }

  .msg { max-width:82%; }
  .msg.user {
    align-self:flex-end; background:linear-gradient(180deg,#36d0a0,#269b76);
    padding:10px 14px; border-radius:14px 14px 3px 14px; font-size:15px; line-height:1.6;
    box-shadow:0 4px 14px rgba(61,220,151,.18); white-space:pre-wrap; word-break:break-word;
  }
  .msg.ai {
    align-self:flex-start; position:relative;
    background:linear-gradient(160deg,#26204066,#211c33), #211c33;
    border:1px solid #3a3058; border-radius:14px 14px 14px 3px;
    padding:12px 16px; max-width:88%;
    white-space:pre-wrap; line-height:1.75; font-size:15px; word-break:break-word;
    box-shadow:0 5px 18px rgba(0,0,0,.35);
  }
  .msg.ai::before { content:'🐌'; position:absolute; left:-22px; top:10px; font-size:16px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .sources { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .src {
    font-size:11px; color:var(--gold); background:rgba(238,199,103,.08);
    border:1px solid rgba(238,199,103,.28); padding:3px 9px; border-radius:10px;
  }
  .loading { color:var(--muted); font-size:14px; display:flex; align-items:center; gap:8px; }
  .loading::before { content:'🎁'; display:inline-block; animation:bounce 1s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
  .err { color:var(--fire); }

  .codelist { margin-top:10px; display:grid; gap:7px; }
  .coderow {
    display:flex; justify-content:space-between; align-items:center; gap:12px;
    background:linear-gradient(180deg, rgba(238,199,103,.08), transparent), #241f3a;
    border:1px solid #3f355f; border-radius:9px; padding:8px 12px; font-size:14px;
    transition:.15s;
  }
  .coderow:hover { border-color:var(--gold2); box-shadow:0 0 12px rgba(238,199,103,.2) inset; }
  .coderow .reward { color:var(--muted); font-size:13px; }
  .copy-btn {
    margin-top:10px; background:linear-gradient(180deg,#ffe9a8,var(--gold) 60%,var(--gold2));
    border:1px solid var(--gold2); color:#2a1c04; padding:8px 14px; border-radius:9px;
    cursor:pointer; font-size:13px; font-weight:700;
  }
  .copy-btn:active { transform:translateY(1px); }
  .att-box { margin-bottom:8px; background:rgba(61,220,151,.07); border:1px solid rgba(61,220,151,.35);
    border-radius:9px; padding:8px 11px; font-size:12px; color:var(--muted); }
  .att-box b { color:var(--ok); }
  .att-box .excerpt { margin-top:4px; color:#8a8199; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

  /* 移动端适配 */
  @media (max-width:640px) {
    header { padding:12px 14px; }
    header h1 { font-size:17px; max-width:60vw; }
    #chatbox { padding:14px 10px; gap:12px; }
    .msg { max-width:92%; }
    .msg.ai { max-width:94%; border-radius:12px 12px 12px 3px; }
    .msg.ai::before { content:none; }
    .bar { padding:10px 10px calc(12px + env(safe-area-inset-bottom)); }
    .toolrow { gap:8px; }
    .pick { padding:7px 10px; font-size:12px; }
    #urlInput { width:100%; min-width:0; }
    #input { padding:12px 12px; font-size:15px; }
    .send { padding:12px 18px; font-size:14px; }
    .coderow { font-size:13px; flex-direction:column; align-items:flex-start; gap:2px; }
  }
</style>
</head>
<body>
<header>
  <h1>🐌 最强蜗牛攻略助手</h1>
  <span id="kb-status">加载中…</span>
</header>
<main id="chatbox"></main>
<footer class="bar">
  <div id="fileChips"></div>
  <div class="toolrow">
    <label class="pick">📎 上传图片/文档<input type="file" id="fileInput" multiple hidden accept=".pdf,.docx,.xlsx,.pptx,.html,.htm,.txt,.md,.png,.jpg,.jpeg,.gif,.webp,.bmp"></label>
    <input id="urlInput" placeholder="🔗 粘贴网页链接（可选）" autocomplete="off">
  </div>
  <div class="inrow">
    <input id="input" placeholder="例：新手刷哪个图？有什么密令？这周的图怎么打？" autocomplete="off">
    <button class="send" id="send">发送</button>
  </div>
</footer>
<script>
const box = document.getElementById('chatbox');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const fileInput = document.getElementById('fileInput');
const urlInput = document.getElementById('urlInput');
const chipWrap = document.getElementById('fileChips');
let selectedFiles = [];

async function kbStatus() {
  try {
    const r = await fetch('/api/kb/stats');
    const s = await r.json();
    const label = s.exists ? `知识库就绪 · ${s.documents} 文档 · ${s.chunks} 片段` : `知识库为空（运行 scripts/build_kb.py 建库）`;
    document.getElementById('kb-status').textContent = label;
  } catch (e) { document.getElementById('kb-status').textContent = '服务未启动'; }
}
kbStatus();

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user'; d.textContent = text; box.appendChild(d);
}
function addAi() {
  const d = document.createElement('div');
  d.className = 'msg ai'; d.innerHTML = '<div class="loading">思考中…</div>';
  box.appendChild(d); scroll();
  return d;
}
function scroll() { box.scrollTop = box.scrollHeight; }

// 附件 chips
function renderChips() {
  chipWrap.innerHTML = '';
  selectedFiles.forEach((f, i) => {
    const span = document.createElement('span');
    span.className = 'chip';
    span.innerHTML = `<b>${f.name}</b> (${(f.size/1024).toFixed(0)}KB)`;
    const x = document.createElement('span');
    x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { selectedFiles.splice(i,1); renderChips(); };
    span.appendChild(x);
    chipWrap.appendChild(span);
  });
}
fileInput.addEventListener('change', () => {
  selectedFiles = [...selectedFiles, ...[...fileInput.files]];
  fileInput.value = '';
  renderChips();
});

// 把回答文本渲染进节点：密令块用卡片样式，其余按原文显示
let pendingCodes = [];
function renderDelta(node, text) {
  pendingCodes = [];
  const isCodes = /^查到以下生效中的密令/.test(text.trim());
  if (isCodes) {
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean).slice(1);
    const rows = lines.map(l => {
      const m = l.match(/密令【(.+?)】：(.+?)（(.+?)）$/);
      const code = m ? m[1] : l;
      const reward = m ? m[2] : '';
      if (m) pendingCodes.push({code, reward});
      return `<div class="coderow"><span>${code}</span><span class="reward">${reward}</span></div>`;
    });
    node.innerHTML = '<b>查到以下生效中的密令：</b>' + '<div class="codelist">' + rows.join('') + '</div>';
  } else {
    node.innerHTML = text.replace(/</g, '&lt;');
  }
}
function waitCodes() { return pendingCodes; }
function copyCodes(btn, codes) {
  const text = codes.map(c => c.code).join('\n');
  const done = () => { const old = btn.textContent; btn.textContent = `✔ 已复制 ${codes.length} 条`; setTimeout(() => btn.textContent = old, 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); done();
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  addUser(q); input.value = '';
  const attachLabel = selectedFiles.length ? `（附带 ${selectedFiles.length} 个附件${urlInput.value.trim() ? ' + 一个网页链接' : ''}）` : (urlInput.value.trim() ? '（附带网页链接）' : '');
  if (attachLabel && (selectedFiles.length || urlInput.value.trim())) addUser(attachLabel);
  sendBtn.disabled = true;
  const node = addAi();
  let sources = [];
  let attachRendered = false;

  try {
    const useAttach = selectedFiles.length || urlInput.value.trim();
    const fd = new FormData();
    fd.append('question', q); fd.append('top_k', '5');
    const url = urlInput.value.trim();
    if (url) fd.append('url', url);
    selectedFiles.forEach(f => fd.append('files', f));
    let resp;
    if (useAttach) {
      resp = await fetch('/api/chat-upload', { method: 'POST', body: fd });
    } else {
      resp = await fetch('/api/chat', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({question: q, top_k: 5})
      });
    }
    selectedFiles = []; urlInput.value = ''; renderChips();
    if (!resp.ok) {
      let detail = '';
      try { detail = (await resp.text()).slice(0, 200); } catch(e) {}
      throw new Error('HTTP ' + resp.status + (detail ? ' · ' + detail : ''));
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '';
    function processBlock(part) {
      const evtLine = part.split('\n').find(l => l.startsWith('event:'));
      const dataLine = part.split('\n').find(l => l.startsWith('data:'));
      if (!dataLine) return;
      let payload; try { payload = JSON.parse(dataLine.slice(5).trim()); } catch(e) { return; }
      const name = evtLine ? evtLine.slice(6).trim() : '';
      if (name === 'sources') {
        sources = payload;
        const loadingEl = node.querySelector('.loading');
        if (loadingEl) loadingEl.remove();
      } else if (name === 'delta') {
        full += payload.content;
        renderDelta(node, full);
        scroll();
      } else if (name === 'parsed') {
        if (!attachRendered) {
          attachRendered = true;
          const boxAtt = document.createElement('div');
          boxAtt.className = 'att-box';
          boxAtt.innerHTML = '<b>已解析你的附件/链接</b><div class="excerpt"></div>';
          boxAtt.querySelector('.excerpt').textContent =
            (payload.parts||[]).map(p => `${p.title}：${p.excerpt||'（空文本）'}`).join('\n');
          node.prepend(boxAtt);
        }
      } else if (name === 'error') {
        throw new Error(payload.message);
      }
    }
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) processBlock(part);
    }
    if (buf.trim()) processBlock(buf);
  } catch (e) {
    node.innerHTML = `<div class="err">⚠ ${e.message}</div>`;
    sendBtn.disabled = false; return;
  }
  if (!(sources||[]).length && !full.trim()) {
    node.innerHTML = '<div class="err">⚠ 服务端未返回内容（知识库可能为空，或 Key 未配置）</div>';
  } else if (!(sources||[]).length) {
    const loadingEl = node.querySelector('.loading');
    if (loadingEl) loadingEl.remove();
  }
  if ((sources||[]).length) {
    const isCodes = (sources||[]).some(s => (s.source||'').includes('密令库'));
    const srcWrap = document.createElement('div');
    srcWrap.className = 'sources';
    (sources||[]).forEach(s => {
      const span = document.createElement('span');
      span.className = 'src';
      span.textContent = (s.source || '密令库') + (s.score ? ` · ${Math.round(s.score*100)}%` : '');
      srcWrap.appendChild(span);
    });
    node.appendChild(srcWrap);
    if (isCodes) {
      const btn = document.createElement('button');
      btn.className = 'copy-btn'; btn.textContent = '📋 复制全部密令';
      btn.onclick = () => copyCodes(btn, waitCodes());
      node.appendChild(btn);
    }
  }
  sendBtn.disabled = false; scroll();
}
sendBtn.onclick = ask;
input.addEventListener('keydown', ev => { if (ev.key === 'Enter') ask(); });
</script>
</body>
</html>
