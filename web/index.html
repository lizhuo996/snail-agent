<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>最强蜗牛攻略助手 Demo</title>
<style>
  :root { --bg:#0f1117; --panel:#1a1e29; --panel2:#222838; --text:#e8eaf0; --muted:#9aa3b5; --accent:#4c8dff; --ok:#2ecc71; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:"Microsoft YaHei", sans-serif; height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--panel); border-bottom:1px solid #2e3342; }
  header h1 { font-size:18px; }
  #kb-status { font-size:12px; color:var(--muted); }
  #chatbox { flex:1; overflow-y:auto; padding:20px; max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  .bar { padding:12px 20px; background:var(--panel); border-top:1px solid #2e3342; }
  .inrow { display:flex; gap:8px; max-width:820px; margin:0 auto; }
  .inrow input { flex:1; padding:12px 14px; border-radius:8px; border:1px solid #2e3342; background:var(--panel2); color:var(--text); }
  .inrow input:focus { outline:none; border-color:var(--accent); }
  .send { padding:12px 22px; border-radius:8px; border:none; background:var(--accent); color:#fff; cursor:pointer; }
  .send:disabled { opacity:.5; cursor:not-allowed; }
  .msg { max-width:78%; }
  .msg.user { align-self:flex-end; background:var(--accent); padding:10px 14px; border-radius:12px 12px 2px 12px; }
  .msg.ai { align-self:flex-start; background:var(--panel); padding:12px 14px; border-radius:12px 12px 12px 2px; white-space:pre-wrap; line-height:1.7; }
  .sources { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .src { font-size:11px; color:var(--muted); background:var(--panel2); padding:3px 8px; border-radius:10px; }
  .loading { color:var(--muted); font-size:13px; }
  .err { color:#ff6b6b; }
  .codelist { margin-top:8px; display:grid; gap:6px; }
  .coderow { display:flex; justify-content:space-between; gap:10px; background:var(--panel2); padding:8px 12px; border-radius:8px; font-size:14px; }
  .coderow .reward { color:var(--muted); font-size:13px; }
  .copy-btn { margin-top:8px; background:var(--panel2); border:1px solid #2e3342; color:var(--text); padding:6px 12px; border-radius:8px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>🐌 最强蜗牛攻略助手</h1>
  <span id="kb-status">加载中…</span>
</header>
<main id="chatbox"></main>
<footer class="bar">
  <div class="inrow">
    <input id="input" placeholder="例：新手前期刷哪个图？本周抽奖周怎么打？有什么密令？" autocomplete="off">
    <button class="send" id="send">发送</button>
  </div>
</footer>
<script>
const box = document.getElementById('chatbox');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

async function kbStatus() {
  try {
    const r = await fetch('/api/kb/stats');
    const s = await r.json();
    const label = s.exists ? `知识库就绪 · 文档 ${s.documents} · 片段 ${s.chunks}` : `知识库为空（运行 scripts/build_kb.py 建库）`;
    document.getElementById('kb-status').textContent = label;
  } catch (e) { document.getElementById('kb-status').textContent = '服务未启动'; }
}
kbStatus();

function addUser(text) {
  const d = document.createElement('div');
  d.className = 'msg user'; d.textContent = text; box.appendChild(d);
}
function addAi() {
  const d = document.createElement('div');
  d.className = 'msg ai'; d.innerHTML = '<div class="loading">思考中…</div>';
  box.appendChild(d); scroll();
  return d;
}
function scroll() { box.scrollTop = box.scrollHeight; }

// 把回答文本渲染进节点：密令块用卡片样式，其余按原文显示
let pendingCodes = [];
function renderDelta(node, text) {
  pendingCodes = [];
  const isCodes = /^查到以下生效中的密令/.test(text.trim());
  if (isCodes) {
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean).slice(1);
    const rows = lines.map(l => {
      const m = l.match(/密令【(.+?)】：(.+?)（(.+?)）$/);
      const code = m ? m[1] : l;
      const reward = m ? m[2] : '';
      if (m) pendingCodes.push({code, reward});
      return `<div class="coderow"><span>${code}</span><span class="reward">${reward}</span></div>`;
    });
    node.innerHTML = '<b>查到以下生效中的密令：</b>' + '<div class="codelist">' + rows.join('') + '</div>';
  } else {
    node.innerHTML = text.replace(/</g, '&lt;');
  }
}
function waitCodes() { return pendingCodes; }
function copyCodes(btn, codes) {
  const text = codes.map(c => c.code).join('\n'); // 一行一条纯密令
  const done = () => { const old = btn.textContent; btn.textContent = `✔ 已复制 ${codes.length} 条`; setTimeout(() => btn.textContent = old, 1500); };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done, () => legacyCopy(text, done));
  } else legacyCopy(text, done);
}
function legacyCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta); done();
}

async function ask() {
  const q = input.value.trim();
  if (!q) return;
  addUser(q); input.value = ''; sendBtn.disabled = true;
  const node = addAi();
  let sources = [];

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question: q, top_k: 5})
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = '', full = '';
    let codeCard = null; // 密令卡片模式（D13）
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts) {
        if (!part.startsWith('data:')) continue;
        let evt; try { evt = JSON.parse(part.slice(5).trim()); } catch(e) { continue; }
        if (evt.sources) {
          sources = evt.sources;
          node.innerHTML = '';
        } else if (evt.delta) {
          full += evt.content;
          renderDelta(node, full);
          scroll();
        } else if (evt.error) {
          node.innerHTML = `<div class="err">⚠ ${evt.error}</div>`;
        }
      }
    }
    // render sources / 密令复制按钮
    if (!codeCard && (sources||[]).length) {
      const isCodes = (sources||[]).some(s => (s.source||'').includes('密令库'));
      const srcWrap = document.createElement('div');
      srcWrap.className = 'sources';
      (sources||[]).forEach(s => {
        const span = document.createElement('span');
        span.className = 'src';
        span.textContent = (s.source || '密令库') + (s.score ? ` · ${Math.round(s.score*100)}%` : '');
        srcWrap.appendChild(span);
      });
      node.appendChild(srcWrap);
      if (isCodes) {  // 复制一行一条密令
        const btn = document.createElement('button');
        btn.className = 'copy-btn'; btn.textContent = '📋 复制全部密令';
        btn.onclick = () => copyCodes(btn, waitCodes());
        node.appendChild(btn);
      }
    }
  } catch (e) {
    node.innerHTML = `<div class="err">⚠ ${e.message}</div>`;
  } finally {
    sendBtn.disabled = false; scroll();
  }
}
sendBtn.onclick = ask;
input.addEventListener('keydown', ev => { if (ev.key === 'Enter') ask(); });
</script>
</body>
</html>
